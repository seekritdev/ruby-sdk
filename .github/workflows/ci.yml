# CI for this mirror: run the cross-implementation vector test on every
# supported Ruby and build the gem. Nothing here publishes — releases are cut
# from seekrit's monorepo. This file is overwritten on each sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Vector test
        run: |
          ruby test/test_vectors.rb
          ruby test/test_token_wire.rb
      - name: Build gem
        run: gem build seekrit.gemspec
